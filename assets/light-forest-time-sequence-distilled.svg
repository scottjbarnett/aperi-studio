<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="900" viewBox="0 0 2400 900" role="img" aria-label="Light Forest sequence: solar panel supporting native regeneration over time, ending with decommissioning">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7d9d8"/>
      <stop offset="55%" stop-color="#bfc4c3"/>
      <stop offset="100%" stop-color="#a5aaa7"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#776f59"/>
      <stop offset="100%" stop-color="#4b493b"/>
    </linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f7d3e"/>
      <stop offset="100%" stop-color="#25341f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#52606a"/>
      <stop offset="45%" stop-color="#232c34"/>
      <stop offset="100%" stop-color="#0e1419"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#16201f" flood-opacity="0.18"/>
    </filter>
    <style>
      .panel-line{stroke:#93a0a7;stroke-width:2;opacity:.55}
      .post{stroke:#8b9292;stroke-width:8;stroke-linecap:round}
      .rail{stroke:#4d5558;stroke-width:7;stroke-linecap:round}
      .ground-line{stroke:#272a22;stroke-width:2;opacity:.25}
      .seed{fill:#6d7e3d}
      .shrub{fill:#455b2f}
      .tree{fill:#334725}
      .flax{stroke:#506a38;stroke-width:7;stroke-linecap:round}
      .pampas{stroke:#d1c391;stroke-width:5;stroke-linecap:round}
      .label{font-family:Inter, Arial, sans-serif;font-size:28px;font-weight:700;fill:#f7f4ee;letter-spacing:.04em}
      .small{font-family:Inter, Arial, sans-serif;font-size:18px;fill:#e9e6dd;letter-spacing:.05em}
      .divider{stroke:#f7f4ee;stroke-width:2;opacity:.35}
    </style>
  </defs>

  <rect width="2400" height="900" fill="url(#sky)"/>

  <!-- distant ranges -->
  <path d="M0 360 C160 310 280 350 430 318 C560 292 685 350 820 310 C990 260 1110 350 1260 315 C1420 280 1535 340 1680 300 C1840 265 1950 345 2100 300 C2240 270 2320 320 2400 290 L2400 900 L0 900 Z" fill="#6f7772" opacity=".42"/>
  <path d="M0 410 C140 375 300 410 470 365 C590 332 760 388 920 360 C1080 328 1210 390 1380 355 C1520 325 1690 390 1840 350 C2010 305 2190 368 2400 330 L2400 900 L0 900 Z" fill="#59655e" opacity=".50"/>

  <!-- ground -->
  <path d="M0 545 C230 515 440 545 600 525 C825 500 990 545 1200 520 C1430 495 1610 545 1800 515 C2020 482 2190 530 2400 500 L2400 900 L0 900 Z" fill="url(#ground)"/>
  <g opacity=".22">
    <path class="ground-line" d="M60 690 C180 660 285 690 410 662"/>
    <path class="ground-line" d="M700 685 C870 650 950 690 1120 660"/>
    <path class="ground-line" d="M1250 705 C1430 660 1590 705 1710 670"/>
    <path class="ground-line" d="M1880 710 C2040 660 2220 700 2370 665"/>
  </g>

  <!-- vertical panels / time divisions -->
  <line class="divider" x1="600" y1="0" x2="600" y2="900"/>
  <line class="divider" x1="1200" y1="0" x2="1200" y2="900"/>
  <line class="divider" x1="1800" y1="0" x2="1800" y2="900"/>

  <!-- labels -->
  <text class="label" x="55" y="80">YEAR 0-3</text>
  <text class="small" x="55" y="112">low scrub / first shelter</text>
  <text class="label" x="655" y="80">YEAR 4-8</text>
  <text class="small" x="655" y="112">seedlings enter the shade zone</text>
  <text class="label" x="1255" y="80">YEAR 9-18</text>
  <text class="small" x="1255" y="112">ecotone borderland zone effect</text>
  <text class="label" x="1855" y="80">YEAR 20+</text>
  <text class="small" x="1855" y="112">forest overtakes / panel decommissioning</text>

  <!-- helper: solar panel groups -->
  <!-- stage 1 panel -->
  <g transform="translate(190,250)" filter="url(#softShadow)">
    <line class="post" x1="110" y1="275" x2="110" y2="560"/>
    <line class="post" x1="250" y1="235" x2="250" y2="555"/>
    <polygon points="0,190 315,90 385,125 72,230" fill="url(#panel)" stroke="#101419" stroke-width="6"/>
    <line class="rail" x1="40" y1="210" x2="350" y2="110"/>
    <line class="panel-line" x1="70" y1="170" x2="145" y2="204"/>
    <line class="panel-line" x1="150" y1="145" x2="225" y2="178"/>
    <line class="panel-line" x1="230" y1="120" x2="305" y2="152"/>
    <line class="panel-line" x1="92" y1="160" x2="160" y2="205"/>
    <line class="panel-line" x1="188" y1="130" x2="255" y2="174"/>
  </g>

  <!-- stage 2 panel -->
  <g transform="translate(780,245)" filter="url(#softShadow)">
    <line class="post" x1="110" y1="275" x2="110" y2="560"/>
    <line class="post" x1="250" y1="235" x2="250" y2="555"/>
    <polygon points="0,190 315,90 385,125 72,230" fill="url(#panel)" stroke="#101419" stroke-width="6"/>
    <line class="rail" x1="40" y1="210" x2="350" y2="110"/>
    <line class="panel-line" x1="70" y1="170" x2="145" y2="204"/>
    <line class="panel-line" x1="150" y1="145" x2="225" y2="178"/>
    <line class="panel-line" x1="230" y1="120" x2="305" y2="152"/>
  </g>

  <!-- stage 3 panel -->
  <g transform="translate(1370,260)" filter="url(#softShadow)">
    <line class="post" x1="105" y1="275" x2="105" y2="520"/>
    <line class="post" x1="245" y1="235" x2="245" y2="500"/>
    <polygon points="0,190 315,90 385,125 72,230" fill="url(#panel)" stroke="#101419" stroke-width="6"/>
    <line class="rail" x1="40" y1="210" x2="350" y2="110"/>
    <line class="panel-line" x1="70" y1="170" x2="145" y2="204"/>
    <line class="panel-line" x1="150" y1="145" x2="225" y2="178"/>
    <line class="panel-line" x1="230" y1="120" x2="305" y2="152"/>
  </g>

  <!-- stage 4 tilted/decommissioning panel -->
  <g transform="translate(1975,325) rotate(-8)" filter="url(#softShadow)">
    <line class="post" x1="105" y1="250" x2="105" y2="455"/>
    <line class="post" x1="245" y1="225" x2="245" y2="435"/>
    <polygon points="0,185 300,92 370,125 70,222" fill="url(#panel)" stroke="#101419" stroke-width="6" opacity=".88"/>
    <line class="rail" x1="38" y1="204" x2="338" y2="111"/>
    <line class="panel-line" x1="70" y1="166" x2="145" y2="198"/>
    <line class="panel-line" x1="150" y1="141" x2="225" y2="174"/>
    <line class="panel-line" x1="230" y1="116" x2="302" y2="148"/>
  </g>

  <!-- vegetation stage 1 -->
  <g transform="translate(0,0)">
    <ellipse class="seed" cx="145" cy="745" rx="34" ry="24"/>
    <ellipse class="seed" cx="262" cy="735" rx="42" ry="28"/>
    <ellipse class="seed" cx="370" cy="755" rx="45" ry="27"/>
    <ellipse class="seed" cx="510" cy="730" rx="36" ry="22"/>
    <path class="flax" d="M430 780 C420 740 435 700 448 670"/>
    <path class="flax" d="M452 785 C455 735 475 700 500 675"/>
    <path class="flax" d="M468 780 C470 740 462 700 455 665"/>
  </g>

  <!-- vegetation stage 2 -->
  <g transform="translate(600,0)">
    <ellipse class="shrub" cx="85" cy="735" rx="55" ry="38"/>
    <ellipse class="shrub" cx="230" cy="715" rx="70" ry="55"/>
    <ellipse class="shrub" cx="395" cy="730" rx="65" ry="45"/>
    <ellipse class="shrub" cx="520" cy="710" rx="76" ry="55"/>
    <path class="tree" d="M170 725 C170 640 140 600 175 560 C215 610 205 655 198 735Z"/>
    <path class="tree" d="M500 720 C510 630 480 600 515 545 C555 610 545 670 535 735Z"/>
    <path class="flax" d="M330 790 C310 725 335 670 360 620"/>
    <path class="flax" d="M360 790 C360 730 390 675 430 640"/>
    <path class="flax" d="M385 790 C390 730 375 665 365 610"/>
  </g>

  <!-- vegetation stage 3 -->
  <g transform="translate(1200,0)">
    <rect x="0" y="575" width="600" height="325" fill="url(#forest)" opacity=".40"/>
    <g fill="#2f4324">
      <ellipse cx="80" cy="690" rx="90" ry="90"/>
      <ellipse cx="190" cy="635" rx="95" ry="135"/>
      <ellipse cx="320" cy="655" rx="120" ry="125"/>
      <ellipse cx="470" cy="610" rx="100" ry="160"/>
      <ellipse cx="570" cy="690" rx="75" ry="110"/>
    </g>
    <g stroke="#1f2a1b" stroke-width="7">
      <line x1="190" y1="720" x2="190" y2="500"/>
      <line x1="320" y1="745" x2="320" y2="520"/>
      <line x1="470" y1="735" x2="470" y2="470"/>
    </g>
    <path class="flax" d="M115 830 C95 735 135 650 175 590"/>
    <path class="flax" d="M155 830 C165 735 205 665 250 610"/>
    <path class="flax" d="M230 825 C245 730 230 660 220 590"/>
    <path class="pampas" d="M120 665 C100 610 80 570 55 535"/>
    <path class="pampas" d="M145 662 C140 600 132 555 118 515"/>
  </g>

  <!-- vegetation stage 4 -->
  <g transform="translate(1800,0)">
    <rect x="0" y="430" width="600" height="470" fill="url(#forest)" opacity=".58"/>
    <g fill="#263d20">
      <ellipse cx="70" cy="610" rx="95" ry="180"/>
      <ellipse cx="170" cy="535" rx="110" ry="235"/>
      <ellipse cx="300" cy="520" rx="120" ry="250"/>
      <ellipse cx="430" cy="545" rx="100" ry="220"/>
      <ellipse cx="560" cy="610" rx="90" ry="170"/>
    </g>
    <g stroke="#182415" stroke-width="8">
      <line x1="170" y1="765" x2="170" y2="310"/>
      <line x1="300" y1="780" x2="300" y2="285"/>
      <line x1="430" y1="770" x2="430" y2="335"/>
    </g>
    <path class="flax" d="M80 855 C70 755 110 665 160 600"/>
    <path class="flax" d="M135 860 C160 755 215 680 280 620"/>
    <path class="flax" d="M215 858 C240 735 230 660 220 570"/>
    <path class="pampas" d="M90 640 C65 585 52 535 42 485"/>
    <path class="pampas" d="M130 650 C130 580 126 535 115 485"/>
  </g>

  <!-- technician in final quarter -->
  <g transform="translate(2195,545)">
    <circle cx="0" cy="-135" r="24" fill="#f2f0e7" stroke="#16201f" stroke-width="3"/>
    <rect x="-26" y="-114" width="54" height="86" rx="8" fill="#d6ea22" stroke="#16201f" stroke-width="3"/>
    <line x1="-16" y1="-28" x2="-28" y2="65" stroke="#16201f" stroke-width="11" stroke-linecap="round"/>
    <line x1="16" y1="-28" x2="35" y2="65" stroke="#16201f" stroke-width="11" stroke-linecap="round"/>
    <line x1="-22" y1="-92" x2="-88" y2="-145" stroke="#16201f" stroke-width="9" stroke-linecap="round"/>
    <line x1="22" y1="-90" x2="85" y2="-142" stroke="#16201f" stroke-width="9" stroke-linecap="round"/>
    <rect x="-42" y="-164" width="85" height="14" rx="5" fill="#16201f"/>
    <rect x="-52" y="62" width="48" height="16" rx="5" fill="#16201f"/>
    <rect x="17" y="62" width="50" height="16" rx="5" fill="#16201f"/>
    <text x="-90" y="128" font-family="Inter, Arial, sans-serif" font-size="22" fill="#f7f4ee">decommissioning</text>
  </g>

  <!-- subtle overlay -->
  <rect width="2400" height="900" fill="none" stroke="#f7f4ee" stroke-width="3" opacity=".32"/>
</svg>
